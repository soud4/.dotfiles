# -*- conf -*-
# ==============================================================================
# Foot Configuration
# Sincronizada y enriquecida con opciones de WezTerm y Kitty
# ==============================================================================

# 1. Shell por defecto
shell=/bin/bash

# 2. Tipografía (MonaspiceNe NFP como base activa, con alternativas de Kitty/Wezterm)
font=MonaspiceNe NFP:size=6
# font=Maple Mono NL NF:size=16
# font=Terminess Nerd Font Mono:size=20

dpi-aware=yes
gamma-correct-blending=yes

# 3. Geometría y Ventana (pad 8x8 y sin decoraciones estilo Kitty)
initial-window-size-chars=120x32
pad=8x8 center-when-maximized-and-fullscreen
resize-by-cells=yes
resize-keep-grid=yes

# 4. Portapapeles
selection-target=clipboard

[cursor]
style=block
blink=yes
blink-rate=600
beam-thickness=2

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000
multiplier=3.0

[url]
launch=xdg-open ${url}

[csd]
# Sin decoraciones de ventana (estilo hide_window_decorations yes de Kitty)
preferred=none

[colors-dark]
alpha=1.0
background=060504
foreground=FAF4EB
cursor=ff8800 d9ae6c

# Colores regulares (0-7)
regular0=0a0a0a   # black
regular1=f07178   # red
regular2=aad94c   # green
regular3=ffcc66   # yellow
regular4=CB8F34   # blue
regular5=d2a6ff   # magenta
regular6=95e6cb   # cyan
regular7=ffffff   # white

# Colores brillantes (8-15)
bright0=3a3a3a
bright1=ff8b92
bright2=c2f970
bright3=ffe082
bright4=EBA43D
bright5=e1bfff
bright6=b3f5e0
bright7=ffffff

# Selección y URLs
selection-foreground=040404
selection-background=d9ae6c
urls=59c2ff

[key-bindings]
# Portapapeles (estilo Kitty/Wezterm)
clipboard-paste=Control+Shift+v XF86Paste
clipboard-copy=Control+Shift+c XF86Copy

# Zoom de fuente (estilo Kitty/Wezterm)
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

# Pantalla completa y Cerrar (estilo Kitty/Wezterm)
fullscreen=F11 Control+Shift+f
quit=Control+Shift+q

# Utilidades
show-urls-launch=Control+Shift+o
