# wdraft -- arrastrar y soltar archivos sin ventana
# Binario en ~/.local/bin/wdraft (make install desde ~/Laboratory/wdraft); ver wdraft(1)
#
# Flujo: se guardan archivos en el "stash" desde la terminal
#   wdraft add foto.png
# luego se pone el puntero sobre la zona de subida y se pulsa $mod+Shift+d.

# Soltar el stash sobre lo que esté bajo el puntero.
# El puntero no se mueve y no se dibuja nada en pantalla.
bindsym $mod+Shift+d exec wdraft drop

# Igual, pero conserva el stash para soltarlo en varios sitios.
bindsym $mod+Ctrl+d exec wdraft drop --keep

# Para destinos que aceptan pegar pero no soltar: deja el stash
# en el portapapeles como text/uri-list.
bindsym $mod+Shift+y exec wdraft copy
