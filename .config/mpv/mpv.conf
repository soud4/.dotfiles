# ==============================================================================
# MPV Configuration — Modern, High Quality & Gruvbox Aesthetic
# ==============================================================================

# ── Video & Renderer ─────────────────────────────────────────
vo=gpu-next
hwdec=auto-safe
gpu-api=auto
profile=high-quality
scale=ewa_lanczos
cscale=ewa_lanczos
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

# ── General & Playback ───────────────────────────────────────
keep-open=yes                      # No cerrar al terminar reproducción
save-position-on-quit=yes          # Recordar punto de reproducción al salir
cursor-autohide=1000               # Ocultar cursor tras 1s
autofit-larger=85%x85%             # Tamaño inicial no excede la pantalla
focus-on=open

# ── Audio ───────────────────────────────────────────────────
volume=100
volume-max=150                     # Permitir boost de volumen hasta 150%
audio-file-auto=fuzzy              # Cargar pistas de audio externas que coincidan
audio-pitch-correction=yes         # Mantener tono al cambiar velocidad

# ── Subtitles (Estilo limpio con acento Gruvbox) ─────────────
sub-auto=fuzzy                     # Cargar subs externos automáticamente
sub-font='Inter'
sub-font-size=38
sub-color='#FAF4EB'
sub-border-color='#282828'
sub-border-size=2.2
sub-shadow-offset=1
sub-shadow-color='#1d2021'
sub-margin-y=36

# ── Screenshots ─────────────────────────────────────────────
screenshot-format=png
screenshot-png-compression=8
screenshot-directory=~/Pictures
screenshot-template="%F_%P_%02n"

# ── Cache & Red ─────────────────────────────────────────────
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=50MiB
