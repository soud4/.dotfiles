# ==============================================================================
# 0. Entorno y Compatibilidad de Terminal
# ==============================================================================
set -g default-terminal "tmux-256color"
set -g default-command "${SHELL}"

# True Color (RGB), cursor styles y secuencias avanzadas
set -sa terminal-features ',xterm-kitty:cstyle,xterm-256color:RGB,tmux-256color:RGB'
set -sg terminal-overrides ",*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%d'   # Soporte para undercurl (ondas de error en Neovim)

# Passthrough para imágenes (Yazi, image.nvim) y eventos de foco
set -g allow-passthrough on
set -g focus-events on
set-option -s extended-keys on
set -g extended-keys-format csi-u

# ==============================================================================
# 1. Configuración General
# ==============================================================================
set -s escape-time 0
set -g history-limit 50000
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename on
set-option -g set-clipboard on
set-option -g status-keys emacs
set-window-option -g aggressive-resize on

# ==============================================================================
# 2. Prefijo y Atajos Generales
# ==============================================================================
# Prefijo: Ctrl+Space
unbind C-b
set-option -g prefix C-SPACE
bind-key C-SPACE send-prefix

# Recargar configuración
bind r source-file ~/.config/tmux/tmux.conf \; display-message "recargada"

# Ocultar / Mostrar barra de estado
bind-key b set-option status

# ==============================================================================
# 3. Navegación y Gestión de Paneles y Ventanas (Estilo Zellij + Tmux)
# ==============================================================================
# Crear splits y ventanas manteniendo la ruta actual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind Enter split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind t new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Cerrar panel / sesión
bind x kill-pane
bind Q kill-session

# Navegación con Prefijo + hjkl
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r ^ last-window

# Navegación RÁPIDA sin prefijo (Alt / Meta)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Enter split-window -h -c "#{pane_current_path}"
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w kill-pane

# --- Funciones Inspiradas en Zellij ---
# Zoom / Fullscreen de panel (ToggleFocusFullscreen)
bind -n M-f resize-pane -Z
bind f resize-pane -Z

# Reordenar pestañas a la izquierda / derecha (MoveTab)
bind -n C-M-h swap-window -d -t -1
bind -n C-M-l swap-window -d -t +1

# Ciclar layouts (SwapLayout)
bind -n M-[ previous-layout
bind -n M-] next-layout

# Romper panel a nueva ventana independiente (BreakPane)
bind B break-pane

# Sincronizar escritura en todos los paneles (ToggleActiveSyncTab)
bind S setw synchronize-panes \; display-message "Sincronización de paneles: #{?pane_synchronized,ACTIVADA,DESACTIVADA}"

# Selección rápida de ventanas con Alt + 1..9 y Alt + n/p
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-n select-window -t:+1
bind -n M-p select-window -t:-1

# Redimensionar paneles (Prefijo + Shift + HJKL)
bind -r H resize-pane -L 3
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 3

# ==============================================================================
# 4. Modo Copia (Vi) y Scrollback en Neovim (EditScrollback)
# ==============================================================================
set-window-option -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Zellij: EditScrollback -> Abrir el historial en Neovim
bind-key e capture-pane -S -32768 -J \; new-window -n '[scrollback]' -c "#{pane_current_path}" \
  "sh -c 'tmux save-buffer /tmp/tmux-scrollback && nvim -c \"normal G$\" -c \"setlocal buftype=nofile bufhidden=wipe noswapfile\" /tmp/tmux-scrollback && rm -f /tmp/tmux-scrollback'"

# ==============================================================================
# 5. Barra de Estado y Apariencia (Tema Gruvbox Dark)
# ==============================================================================
set -g status-position top
set -g status-interval 5
set -g status-justify absolute-centre
set -g status-style "bg=default,fg=#d0d0d0"
set -g status-left ""
set -g status-right ""

# Mensajes
set -g message-style "bg=default,fg=#f7ca88"
set -g message-command-style reverse
setw -g mode-style "reverse"

# Tabs (Paleta Gruvbox Dark)
setw -g window-status-format "#[bg=default,fg=#a89984] #I:#W "
setw -g window-status-current-format "#[bg=default,fg=#dc9656,bold] #I:#W "

# Bordes de paneles (Gruvbox Cian/Gris)
set -g pane-border-lines simple
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#86c1b9"

# ==============================================================================
# 6. Popups y Scripts Externos
# ==============================================================================
bind E display-popup -E
bind G new-window -n 'lazygit' lazygit
bind-key f run-shell "tmux neww ~/bin/tmux-sessionizer"
bind-key u run-shell "~/bin/tmux-sessionizer u"
bind-key n run-shell "~/bin/tmux-sessionizer ~/org"
