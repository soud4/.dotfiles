# ==========================================================================
#   SOUDA -- tmux.conf
#   gruvbox dark, ultra-minimalista, TTY-safe (ASCII puro)
#   2026-09-21
# ==========================================================================

# --------------------------------------------------------------------------
#  0  Paleta Gruvbox Dark (referencia)
# --------------------------------------------------------------------------
# bg0 #282828  bg1 #3c3836  bg2 #504945  bg3 #665c54
# fg0 #fbf1c7  fg1 #ebdbb2  fg2 #d5c4a1  fg3 #bdae93
# fg4 #a89984  red #fb4934  grn #b8bb26  yel #fabd2f
# blu #83a598  pur #d3869b  aqu #8ec07c  org #fe8019
# gry #928374

# --------------------------------------------------------------------------
#  1  Terminal y compatibilidad
# --------------------------------------------------------------------------
set  -g  default-terminal    "tmux-256color"
set  -g  default-command     "${SHELL}"

# True Color + undercurl + cursor styles
set  -sa terminal-features   ',xterm-kitty:cstyle,xterm-256color:RGB,tmux-256color:RGB'
set  -sg terminal-overrides  ",*:RGB"
set  -as terminal-overrides  ',*:Smulx=\E[4::%p1%d'
set  -as terminal-overrides  ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Passthrough (Yazi, image.nvim) + foco + extended keys
set  -g  allow-passthrough   on
set  -g  focus-events        on
set  -s  extended-keys       on
set  -g  extended-keys-format csi-u
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# --------------------------------------------------------------------------
#  2  General
# --------------------------------------------------------------------------
set  -s  escape-time         0
set  -g  history-limit       100000
set  -g  mouse               on
set  -g  base-index          1
set  -g  pane-base-index     1
set  -g  renumber-windows    on
set  -g  allow-rename        on
set  -g  set-clipboard       on
set  -g  status-keys         emacs
setw -g  aggressive-resize   on
set  -g  display-time        2000
set  -g  display-panes-time  2000
set  -g  repeat-time         600

# --------------------------------------------------------------------------
#  3  Prefijo: Ctrl+Space
# --------------------------------------------------------------------------
unbind C-b
set   -g prefix C-Space
bind  C-Space send-prefix

# --------------------------------------------------------------------------
#  4  Recarga y utilidades
# --------------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message " config recargada"
bind b set-option status
bind m set-option -g mouse \; display-message "#{?mouse, mouse ON, mouse OFF}"

# --------------------------------------------------------------------------
#  5  Splits, ventanas y paneles
# --------------------------------------------------------------------------
bind  |     split-window -h  -c "#{pane_current_path}"
bind  -     split-window -v  -c "#{pane_current_path}"
bind  \\    split-window -h  -c "#{pane_current_path}"
bind  Enter split-window -h  -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"
bind t new-window -c "#{pane_current_path}"

bind x   kill-pane
bind X   kill-window
bind Q   confirm-before -p " kill session '#{session_name}'? (y/n)" kill-session

# --------------------------------------------------------------------------
#  6  Navegacion
# --------------------------------------------------------------------------
# Con prefijo (repeatable)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r ^ last-window

# Sin prefijo: Alt+hjkl
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Sin prefijo: acciones rapidas
bind -n M-Enter split-window -h -c "#{pane_current_path}"
bind -n M-t     new-window      -c "#{pane_current_path}"
bind -n M-w     kill-pane

# Zoom
bind -n M-f resize-pane -Z
bind    f   resize-pane -Z

# Reordenar tabs
bind -n C-M-h swap-window -d -t -1
bind -n C-M-l swap-window -d -t +1

# Ciclar layouts
bind -n M-[ previous-layout
bind -n M-] next-layout

# Break pane
bind B break-pane

# Sincronizar paneles
bind S setw synchronize-panes \; display-message "#{?pane_synchronized, SYNC ON, SYNC OFF}"

# Alt+1..9
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-n select-window -t:+1
bind -n M-p select-window -t:-1

# Redimensionar paneles
bind -r H resize-pane -L 3
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 3

# Rotar / swap paneles
bind -r o rotate-window
bind -r O rotate-window -D
bind   M select-pane -m
bind C-s swap-pane

# --------------------------------------------------------------------------
#  7  Modo Copia (Vi)
# --------------------------------------------------------------------------
setw -g mode-keys vi

bind    v copy-mode
bind -n M-v copy-mode

bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H      send -X start-of-line
bind -T copy-mode-vi L      send -X end-of-line
bind -T copy-mode-vi /      command-prompt -i -p "/" "send -X search-forward \"%%%\""
bind -T copy-mode-vi ?      command-prompt -i -p "?" "send -X search-backward \"%%%\""

# Scrollback en Neovim
bind e capture-pane -S -32768 -J \; new-window -n 'scrollback' -c "#{pane_current_path}" \
  "sh -c 'tmux save-buffer /tmp/tmux-scrollback && nvim -c \"normal G$\" -c \"setlocal buftype=nofile bufhidden=wipe noswapfile\" /tmp/tmux-scrollback && rm -f /tmp/tmux-scrollback'"

# --------------------------------------------------------------------------
#  8  Apariencia -- Gruvbox Dark Ultra-Minimalista (TTY-safe)
# --------------------------------------------------------------------------

set  -g  status-position     top
set  -g  status-interval     5
set  -g  status-justify      absolute-centre

# Fondo transparente, solo tabs
set  -g  status-style "bg=default,fg=#a89984"
set  -g  status-left  ""
set  -g  status-right "#{?window_zoomed_flag,#[fg=#fabd2f] [Z] #[default],}"

# -- Tabs ----------------------------------------------------------------------
setw -g  window-status-format         "#[fg=#665c54,bg=default] #I:#W #[default]"
setw -g  window-status-current-format "#[fg=#fabd2f,bg=default,bold] #I:#W #[default]"
setw -g  window-status-separator      ""

# -- Bordes de paneles --------------------------------------------------------
set  -g  pane-border-lines        single
set  -g  pane-border-style        "fg=#3c3836"
set  -g  pane-active-border-style "fg=#504945"
set  -g  pane-border-indicators   colour

# -- Pane number display ------------------------------------------------------
set  -g  display-panes-colour        "#665c54"
set  -g  display-panes-active-colour "#fabd2f"

# -- Mensajes ------------------------------------------------------------------
set  -g  message-style         "bg=#3c3836,fg=#fabd2f,bold"
set  -g  message-command-style "bg=#3c3836,fg=#8ec07c"

# -- Modo copia (seleccion) ---------------------------------------------------
setw -g  mode-style "bg=#504945,fg=#fbf1c7"

# -- Clock mode ----------------------------------------------------------------
setw -g  clock-mode-colour "#fabd2f"
setw -g  clock-mode-style  24

# -- Popup styling -------------------------------------------------------------
set  -g  popup-border-lines  rounded
set  -g  popup-border-style  "fg=#504945"

# --------------------------------------------------------------------------
#  9  Popups, FZF y herramientas externas
# --------------------------------------------------------------------------

# Shell flotante
bind E display-popup -E -w 80% -h 70% -b rounded -S "fg=#504945"

# Lazygit popup
bind G display-popup -E -w 90% -h 85% -b rounded -S "fg=#504945" -T " lazygit " "lazygit 2>/dev/null || echo 'lazygit no instalado' && sleep 2"

# FZF session switcher -- Alt+s
bind -n M-s display-popup -E -w 40% -h 50% -b rounded -S "fg=#504945" -T " sesiones " "\
  tmux list-sessions -F '#{session_name}' | \
  fzf --reverse --header='Cambiar sesion' \
      --preview='tmux capture-pane -t {} -p -e 2>/dev/null | head -30' \
      --preview-window=right:60% \
      --color='bg+:#3c3836,fg:#ebdbb2,fg+:#fabd2f,hl:#8ec07c,hl+:#b8bb26,border:#504945,header:#928374,pointer:#fe8019,prompt:#83a598' | \
  xargs -r tmux switch-client -t"

# FZF window switcher -- Alt+W
bind -n M-W display-popup -E -w 40% -h 50% -b rounded -S "fg=#504945" -T " ventanas " "\
  tmux list-windows -a -F '#{session_name}:#{window_index} > #{window_name} #{?window_active,*,.}' | \
  fzf --reverse --header='Cambiar ventana' \
      --color='bg+:#3c3836,fg:#ebdbb2,fg+:#fabd2f,hl:#8ec07c,hl+:#b8bb26,border:#504945,header:#928374,pointer:#fe8019,prompt:#83a598' | \
  cut -d' ' -f1 | xargs -r tmux switch-client -t"

# Sessionizer (si existe)
if-shell "test -x ~/bin/tmux-sessionizer" {
  bind-key i run-shell "tmux neww ~/bin/tmux-sessionizer"
  bind-key u run-shell "~/bin/tmux-sessionizer u"
  bind-key n run-shell "~/bin/tmux-sessionizer ~/org"
}

# --------------------------------------------------------------------------
#  10  Hooks
# --------------------------------------------------------------------------

# Auto-rename: directorio si bash, programa si no
set  -g  automatic-rename        on
set  -g  automatic-rename-format "#{?#{==:#{pane_current_command},bash},#{b:pane_current_path},#{pane_current_command}}"

# Actividad sutil en otras ventanas
setw -g  monitor-activity on
set  -g  visual-activity  off
setw -g  window-status-activity-style "fg=#fe8019,bg=default,none"

# --------------------------------------------------------------------------
#  11  Cheatsheet
# --------------------------------------------------------------------------
#
#  C-Space       -- Prefijo
#  |  -  \       -- Splits (h, v, h)
#  Alt+hjkl      -- Navegar paneles
#  Alt+1..9      -- Ir a ventana N
#  Alt+n / Alt+p -- Siguiente / anterior ventana
#  Alt+f         -- Zoom toggle
#  Alt+s         -- FZF session switcher
#  Alt+W         -- FZF window switcher
#  Alt+Enter     -- Split horizontal rapido
#  Alt+t         -- Nueva ventana
#  Alt+w         -- Cerrar panel
#  Alt+v         -- Modo copia
#  C-M-h / C-M-l-- Mover tab izq / der
#  Alt+[ / ]     -- Ciclar layouts
#  P+e           -- Scrollback en Neovim
#  P+G           -- Lazygit (popup)
#  P+E           -- Shell popup
#  P+b           -- Toggle barra de estado
#  P+m           -- Toggle mouse
#  P+r           -- Recargar config
#  P+S           -- Sync paneles
#  P+B           -- Break pane
#  P+x / X / Q  -- Kill pane / window / session
#
# vim: set ft=tmux tw=0 nowrap:
